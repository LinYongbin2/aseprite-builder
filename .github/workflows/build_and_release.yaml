name   名字: Build and release Aseprite

on:   :
  push:   推动:
    branches:   分支:
      - main   ——主要
    paths:   道路:
      - 'BuildLog.md'
  workflow_dispatch:
env:
  BUILD_TYPE: Release   BUILD_TYPE:释放BUILD_TYPE：释放

jobs:   工作:
  fetch-aseprite-info:
    name: Fetch deps info   name：获取深度信息
    runs-on: ubuntu-latest   上运行:ubuntu-latest运行版本：ubuntu-latest
    outputs:   输出:
      download-link: $下载链接：$下载链接：${{steps. aseprites -link.outputs。上述}}{{steps. aseprites -link.outputs。上述}}{{ steps.aseprite-link.outputs.download-link }}
      release-tag: $Release-tagRelease-tag: ${{steps.asepri -link.outputs。版本标记}}: ${{steps.asepri -link.outputs。版本标记}}{{ steps.aseprite-link.outputs.release-tag }}
    steps:   步骤:
      - name   名字: Fetch Aseprite release link—name：获取Aseprite发布链接—name：获取Aseprite发布链接
        id: aseprite-link
        uses: a1393323447/fetch-release@main用途:a1393323447 / fetch-release@main
        with:
            group: aseprite   aseprite group):
            repo: aseprite   回购:aseprite
            match: Aseprite-.*?-Source.zip匹配:Aseprite - . * ? -Source.zip

  create-release   创建发布:
    name   名字: Create Release   名称：创建发布
    runs-on   运行在: ubuntu-latest   上运行:ubuntu-latest
    needs   需要: fetch-aseprite-info需求:fetch-aseprite-info
    permissions   权限:
      contents   内容: write   内容:写
    outputs   输出:
      download-link   上述英文: $下载链接：${{needs.fetch-aseprite-info.outputs。上述}}{{ needs.fetch-aseprite-info.outputs.download-link }}
      release-tag   版本标记: $Release-tag: ${{needs.fetch-aseprite-info.outputs。版本标记}}{{ needs.fetch-aseprite-info.outputs.release-tag }}
    steps   步骤:
      - uses: actions/checkout@v2-使用：actions/checkout@v2
      - uses: ncipollo/release-action@v1-使用：ncipollo/release-action@v1
        with   与:
          tag: $标签：${{needs.fetch-aseprite-info.outputs。版本标记}}{{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-$body: Aseprite-${{needs.fetch-aseprite-info.outputs。版本标记}}{{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: $Token: ${{secrets。GITHUB_TOKEN}}{{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name   名字: Build Aseprite
    needs   需要: create-release
    permissions   权限:
      contents   内容: write   内容:写
    runs-on   运行在: ${{ matrix.os }}
    strategy:
        matrix:
          os: [ windows-latest操作系统：[windows-最新], 
        fail-fast: false
    steps   步骤:
      - name   名字: Install Dependencies
        if: runner.os ==    如果:跑步。os == ‘Linux’'Linux'
        shell: bash   bash shell:
        run: |
          sudo apt-get update -qq   执行命令apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - uses   使用: actions/checkout@v4
      - name: Install Aseprite   —name：安装Aseprite
        shell: bash   bash shell:
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.create-release.outputs.release-tag }}
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]] ; then
            choco install wget -y --no-progress
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
            unzip Skia-Windows-Release-x64.zip -d skia
          elif [[ "${{ runner.os }}" == "macOS" ]] ; then
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-macOS-Release-arm64.zip
            unzip Skia-macOS-Release-arm64.zip -d skia
          else
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
            unzip Skia-Linux-Release-x64.zip -d skia
          fi
      - uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Generating Makefiles
        shell: bash   bash shell:
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on

          if [[ "${{ runner.os }}" == "macOS" ]] ; then
            export skia_arch=arm64
          else
            export skia_arch=x64
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DENABLE_TESTS=OFF \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && ninja
      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite' -o -name 'aseprite.exe' -o -name 'data' -prune \) -exec rm -rf {} +
      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
      - name: Create release
        working-directory: aseprite/build/bin
        run: 7z -tzip a Aseprite-${{ needs.create-release.outputs.release-tag }}-${{ runner.os }}.zip *
      - name: Upload release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.create-release.outputs.release-tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.create-release.outputs.release-tag }}-${{ runner.os }}.zip
          tag: ${{ needs.create-release.outputs.release-tag }}
